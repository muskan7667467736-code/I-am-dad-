

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip python3-dev \
            build-essential libffi-dev libssl-dev

      - name: Setup Android SDK Manually
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          java -version
          sdkmanager --version
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "build-tools;37.0.0"

      - name: Prepare Buildozer SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"
          ln -sfn "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

      - name: Install Buildozer
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user \
            buildozer cython==0.29.33
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: I-AM-DAD-APK
          path: bin/*.apk
          if-no-files-found: error
